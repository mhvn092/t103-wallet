services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

  simulator:
    image: hamtapay/t103-simulator:1.0
    restart: unless-stopped
    ports:
      - "${SIMULATOR_PORT:-8080}:8080"
    environment:
      SIM_CHAOS: ${SIM_CHAOS:-default}
      SIM_TIME_SCALE: ${SIM_TIME_SCALE:-1}
      SIM_PUBLIC_URL: http://simulator:8080
      PAYOUT_WEBHOOK_URL: http://app:3000/webhooks/payout
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET}

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      simulator:
        condition: service_started
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-local}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      PORT: 3000
      DATABASE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RABBITMQ_URI: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672?heartbeat=60
      PSP_BASE_URL: http://simulator:8080
      PAYOUT_BASE_URL: http://simulator:8080
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://app:3000}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      INTERNAL_ALLOWED_IPS: ${INTERNAL_ALLOWED_IPS:-}
      READINESS_DB_TIMEOUT_MS: ${READINESS_DB_TIMEOUT_MS:-2000}
      WD_MANUAL_REVIEW_SLA_MS: ${WD_MANUAL_REVIEW_SLA_MS:-1800000}
      MIN_WITHDRAWAL_IRT: ${MIN_WITHDRAWAL_IRT:-100000}
      MIN_WITHDRAWAL_USDT: ${MIN_WITHDRAWAL_USDT:-10}
      USDT_WITHDRAWAL_FEE: ${USDT_WITHDRAWAL_FEE:-1}
      DAILY_LIMIT_IRT: ${DAILY_LIMIT_IRT:-200000000}
      USDT_IRT_RATE: ${USDT_IRT_RATE:-60000}
      DEPOSIT_TTL_SECONDS: ${DEPOSIT_TTL_SECONDS:-1800}
      PROVIDER_HTTP_TIMEOUT_MS: ${PROVIDER_HTTP_TIMEOUT_MS:-10000}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
      WORKERS_ENABLED: ${WORKERS_ENABLED:-true}

volumes:
  pgdata:
